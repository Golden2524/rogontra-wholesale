<!doctype html>
<html>
  <head>
    <title>Catalogue administration | Rogontra Wholesale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <a href="index.html"><img src="images/rogontra-logo.svg" alt="Rogontra Wholesale" /></a>
      <div>
        <a href="index.html">View storefront</a>
        <button class="js-admin-sign-out" type="button">Sign out</button>
      </div>
    </header>
    <main class="admin-main">
      <p class="admin-eyebrow">Administrator workspace</p>
      <h1>Catalogue management</h1>
      <p class="admin-intro">
        Demo records are clearly labelled. Replace them by editing a product or add approved real
        products below. All live pricing remains in USD cents, and quote-only products must not have
        a price.
      </p>
      <p class="admin-status js-admin-status" role="status"></p>

      <section class="admin-panel" aria-labelledby="product-form-title">
        <div class="admin-panel-heading">
          <h2 id="product-form-title" class="js-product-form-title">Add a product</h2>
          <button class="secondary-button js-cancel-edit" type="button" hidden>Cancel edit</button>
        </div>
        <form class="admin-form js-product-form">
          <label
            >Product ID<input
              name="externalId"
              required
              placeholder="rgw-example-001"
              pattern="[a-z0-9][a-z0-9-]{2,99}"
          /></label>
          <label>SKU<input name="sku" required placeholder="RGW-CAT-001" /></label>
          <label>Product name<input name="name" required /></label>
          <label>Category<input name="category" required placeholder="Heavy Equipment" /></label>
          <label
            >Image URL or project path<input
              name="image"
              required
              placeholder="images/products/your-product.jpg"
          /></label>
          <label
            >Description<textarea name="description" rows="3" maxlength="5000"></textarea>
          </label>
          <label
            >Purchase mode<select name="purchaseMode">
              <option value="checkout">Checkout</option>
              <option value="quote">Quote only</option>
            </select></label
          >
          <label
            >USD price in cents<input
              name="priceCents"
              type="number"
              min="0"
              placeholder="e.g. 125000"
          /></label>
          <label
            >Condition<select name="condition">
              <option value="new">New</option>
              <option value="used">Used</option>
              <option value="refurbished">Refurbished</option>
            </select></label
          >
          <label
            >Minimum order quantity<input
              name="minimumOrderQuantity"
              type="number"
              min="1"
              value="1"
              required
          /></label>
          <label
            >Stock status<select name="stockStatus">
              <option value="in_stock">In stock</option>
              <option value="limited_stock">Limited stock</option>
              <option value="out_of_stock">Out of stock</option>
              <option value="quote_required">Quote required</option>
            </select></label
          >
          <label
            >Keywords (comma separated)<input name="keywords" placeholder="truck, fleet, haulage"
          /></label>
          <label
            >Specifications (JSON object)<textarea
              name="specifications"
              rows="4"
              required
              placeholder='{"capacity":"10 t","fuel":"Diesel"}'
            >
{}</textarea>
          </label>
          <label class="checkbox-label"
            ><input name="isActive" type="checkbox" checked /> Visible on storefront</label
          >
          <button class="primary-button js-save-product" type="submit">Save product</button>
        </form>
      </section>

      <section class="admin-panel" aria-labelledby="catalogue-list-title">
        <div class="admin-panel-heading">
          <h2 id="catalogue-list-title">All products</h2>
          <span class="js-product-count"></span>
        </div>
        <div class="admin-product-list js-admin-product-list"></div>
      </section>
    </main>
    <script type="module" src="scripts/admin.js"></script>
  </body>
</html>
