<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in | Rogontra Wholesale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/auth.css" />
  </head>
  <body>
    <main class="auth-main">
      <a class="auth-logo-link" href="index.html"
        ><img src="images/rogontra-logo-dark.svg" alt="Rogontra Wholesale"
      /></a>
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="auth-eyebrow">Customer procurement portal</p>
        <h1 id="auth-title">Sign in</h1>
        <p class="auth-intro">Access your quotes, test orders, and procurement history.</p>
        <form class="js-auth-form">
          <label class="js-display-name-field"
            >Full name<input
              name="displayName"
              autocomplete="name"
              required
              minlength="2"
              maxlength="100"
          /></label>
          <label>Email<input name="email" type="email" autocomplete="email" required /></label>
          <label
            >Password<input
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
          /></label>
          <button class="button-primary js-auth-submit" type="submit">Create account</button>
          <p class="auth-status js-auth-status" role="status"></p>
        </form>
        <p class="auth-toggle">
          <span class="js-toggle-question">Already have an account?</span>
          <button class="link-primary js-auth-toggle" type="button">Sign in</button>
        </p>
      </section>
    </main>
    <script src="runtime-config.js"></script>
    <script type="module" src="scripts/auth-page.js"></script>
  </body>
</html>
