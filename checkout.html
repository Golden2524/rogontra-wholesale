<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secure order review | Rogontra Wholesale</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css" />
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to order review</a>
    <div class="checkout-header">
      <div class="header-content js-header-content"></div>
    </div>

    <main class="main" id="main-content" tabindex="-1">
      <div class="page-title">Secure order review</div>
      <p class="checkout-notice">
        Prices are in USD. Dispatch dates, taxes, and delivery costs are reviewed before payment.
      </p>
      <p class="checkout-status js-checkout-status" role="status" aria-live="polite"></p>
      <form class="delivery-address-form js-delivery-address-form" id="delivery-address-form">
        <h2>Delivery destination</h2>
        <p>
          Used only to review shipping and fulfil this order. Fields marked required are needed
          before payment.
        </p>
        <div class="delivery-address-grid">
          <label
            >Recipient name<input
              name="recipientName"
              minlength="2"
              maxlength="200"
              autocomplete="name"
              required
          /></label>
          <label
            >Phone number<input
              name="phone"
              type="tel"
              minlength="5"
              maxlength="40"
              autocomplete="tel"
              required
          /></label>
          <label class="delivery-address-wide"
            >Address line 1<input
              name="addressLine1"
              minlength="5"
              maxlength="200"
              autocomplete="address-line1"
              required
          /></label>
          <label class="delivery-address-wide"
            >Address line 2 <span>(optional)</span
            ><input name="addressLine2" maxlength="200" autocomplete="address-line2"
          /></label>
          <label
            >City<input
              name="city"
              minlength="2"
              maxlength="100"
              autocomplete="address-level2"
              required
          /></label>
          <label
            >Postal code <span>(optional where unavailable)</span
            ><input name="postalCode" maxlength="30" autocomplete="postal-code"
          /></label>
          <label class="delivery-address-wide"
            >Country<input
              name="country"
              minlength="2"
              maxlength="100"
              autocomplete="country-name"
              required
          /></label>
        </div>
      </form>

      <div class="checkout-grid">
        <div class="order-summary js-order-summary"></div>

        <div class="payment-summary js-payment-summary"></div>
      </div>
    </main>

    <script type="module" src="scripts/checkout.js"></script>
  </body>
</html>
