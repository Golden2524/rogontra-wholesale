<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset password | Rogontra Wholesale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/auth.css" />
  </head>
  <body>
    <main class="auth-main">
      <a class="auth-logo-link" href="index.html"
        ><img src="images/rogontra-logo-dark.svg" alt="Rogontra Wholesale"
      /></a>
      <section class="auth-card" aria-labelledby="password-reset-title">
        <p class="auth-eyebrow">Account recovery</p>
        <h1 id="password-reset-title">Reset your password</h1>
        <p class="auth-intro">
          Enter your account email. If it is registered, we will send a one-time reset link.
        </p>
        <form class="js-password-reset-request-form">
          <label>Email<input name="email" type="email" autocomplete="email" required /></label>
          <button class="button-primary js-password-reset-submit" type="submit">
            Send reset link
          </button>
          <p class="auth-status js-password-reset-status" role="status"></p>
        </form>
        <p class="auth-toggle"><a class="link-primary" href="auth.html">Return to sign in</a></p>
      </section>
    </main>
    <script src="runtime-config.js"></script>
    <script type="module" src="scripts/forgot-password.js"></script>
  </body>
</html>
