<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account | Rogontra Wholesale</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/shared/index-header.css" />
    <link rel="stylesheet" href="styles/pages/orders.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to account</a>
    <div class="rogontra-header">
      <div class="rogontra-header-left-section">
        <a href="index.html" class="header-link">
          <img class="rogontra-logo" src="images/rogontra-logo.svg" alt="Rogontra Wholesale" />
          <img class="rogontra-mobile-logo" src="images/rogontra-mark.svg" alt="Rogontra" />
        </a>
      </div>

      <div class="rogontra-header-middle-section">
        <input
          class="search-bar js-search-bar"
          type="text"
          placeholder="Search products, equipment, and parts"
          aria-label="Search catalogue"
        />

        <button class="search-button js-search-button" aria-label="Search catalogue">
          <img class="search-icon" src="images/icons/rogontra-search.svg" alt="" />
        </button>
      </div>

      <div class="rogontra-header-right-section">
        <a class="account-link header-link js-account-link" href="auth.html">
          <span class="returns-text js-account-label">Account</span>
          <span class="orders-text js-account-action">Sign in</span>
        </a>
        <button class="sign-out-button js-sign-out" type="button" hidden>Sign out</button>
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Procurement</span>
          <span class="orders-text">Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html" aria-label="View cart">
          <img class="cart-icon" src="images/icons/rogontra-cart.svg" alt="" />
          <div class="cart-quantity js-quantity-count">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <main class="main" id="main-content" tabindex="-1">
      <div class="page-title">Your account</div>
      <p class="account-intro js-account-intro"></p>
      <p class="account-message js-account-message" role="status"></p>

      <section class="account-overview" aria-label="Account overview">
        <article class="account-overview-card">
          <span class="account-overview-label">Orders</span>
          <strong class="account-overview-value js-order-count">0</strong>
        </article>
        <article class="account-overview-card">
          <span class="account-overview-label">Quote requests</span>
          <strong class="account-overview-value js-quote-count">0</strong>
        </article>
        <a class="account-overview-action" href="index.html">Browse catalogue</a>
      </section>

      <section class="account-section" aria-labelledby="orders-title">
        <h1 class="account-section-title" id="orders-title">Your orders</h1>
        <div class="orders-grid js-order-grid"></div>
      </section>

      <section class="account-section" aria-labelledby="quotes-title">
        <h2 class="account-section-title" id="quotes-title">Your quote requests</h2>
        <div class="quote-history-grid js-quote-history-grid"></div>
      </section>
    </main>

    <script src="runtime-config.js"></script>
    <script type="module" src="scripts/order.js"></script>
    <script type="module" src="scripts/account-link.js"></script>
  </body>
</html>
