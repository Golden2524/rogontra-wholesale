<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Choose a new password | Rogontra Wholesale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/auth.css" />
  </head>
  <body>
    <main class="auth-main">
      <a class="auth-logo-link" href="index.html"
        ><img src="images/rogontra-logo-dark.svg" alt="Rogontra Wholesale"
      /></a>
      <section class="auth-card" aria-labelledby="new-password-title">
        <p class="auth-eyebrow">Account recovery</p>
        <h1 id="new-password-title">Choose a new password</h1>
        <p class="auth-intro">
          Use at least 12 characters. This reset link expires after 30 minutes and can only be used
          once.
        </p>
        <form class="js-new-password-form">
          <label
            >New password<input
              name="password"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="128"
          /></label>
          <label
            >Confirm new password<input
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="128"
          /></label>
          <button class="button-primary js-new-password-submit" type="submit">
            Save new password
          </button>
          <p class="auth-status js-new-password-status" role="status"></p>
        </form>
        <p class="auth-toggle"><a class="link-primary" href="auth.html">Return to sign in</a></p>
      </section>
    </main>
    <script src="runtime-config.js"></script>
    <script type="module" src="scripts/reset-password.js"></script>
  </body>
</html>
